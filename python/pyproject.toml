[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ic705bridge"
dynamic = ["version"]
description = "Client Python bas niveau pour IC705 Bridge (API locale CI-V pour l'Icom IC-705)."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "BleuRouge_Fab" }]
keywords = ["icom", "ic-705", "ci-v", "ham-radio", "rs-ba1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Communications :: Ham Radio",
]
dependencies = []  # stdlib uniquement

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/BleuRouge/IC705-Bridge"

[tool.hatch.version]
path = "ic705bridge.py"

[tool.hatch.build.targets.wheel]
only-include = ["ic705bridge.py"]

[tool.hatch.build.targets.sdist]
include = ["ic705bridge.py", "example.py", "COMMANDS.md", "README.md", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
