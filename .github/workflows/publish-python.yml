name: Publish Python lib

# Publie la librairie `ic705bridge` sur PyPI.
#
# Déclencheurs :
#  - un tag `py-v*` (ex. `git tag py-v0.1.1 && git push origin py-v0.1.1`) ;
#  - un lancement manuel (onglet Actions > Publish Python lib > Run workflow).
#
# Authentification par « Trusted Publishing » (OIDC) : aucun token à stocker.
# Configuration unique côté PyPI décrite dans docs/RELEASING.md §6.

on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # requis pour le Trusted Publishing PyPI (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
